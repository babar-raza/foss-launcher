schema_version: "1.0"

style:
  tone: "technical"
  audience: "developers"
  forbid_marketing_superlatives: true
  forbid_em_dash: true
  prefer_short_sentences: true
  forbid_weasel_words:
    - "best"
    - "seamless"
    - "ultimate"
    - "revolutionary"
    - "world-class"

truth:
  no_uncited_facts: true
  allow_external_citations: false
  forbid_inferred_formats: true
  allow_inference: false

editing:
  diff_only: true
  forbid_full_rewrite_existing_files: true
  forbid_deleting_existing_files: true

hugo:
  allow_shortcodes:
    - "note"
    - "tabs"
    - "tab"
    - "code"
  forbid_raw_html_except_claim_markers: true

claims:
  marker_style: "html_comment"  # html_comment | frontmatter
  html_comment_prefix: "claim_id:"
  remove_markers_on_publish: false
  enrichment_batch_size: 200     # Round 12: Top-N claims for LLM enrichment
  confidence_minimum: 0.5        # Round 12: Reject claims below this confidence

# Round 12: Multi-pass LLM generation settings (TC-1703)
multi_pass:
  enabled: false                    # Backward compat: off by default
  outline_temperature: 0.0          # Pass 1: Outline (JSON)
  draft_temperature: 0.1            # Pass 2: Draft (markdown)
  refine_temperature: 0.0           # Pass 3: Refine (markdown)
  min_claims_for_outline: 3         # Skip outline for thin pages
  skip_refine_for_thin_pages: true  # Skip pass 3 if draft <200 words

# Round 12: Incremental update settings (TC-1703)
incremental:
  enabled: false                          # Backward compat: off by default
  page_preservation_threshold: 0.75       # Jaccard overlap for page reuse
  claim_enrichment_strategy: "full_re_enrich"  # full_re_enrich | incremental_only

# Round 13: Slug and title quality rules
slug_rules:
  max_length: 40                           # Excluding prefix (e.g., "how-to-")
  pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$" # Lowercase, hyphen-separated, alphanumeric
  forbid_raw_truncation: true              # MUST NOT derive from claim_text[:N]
  deduplication: true                      # Enforce per-section uniqueness
  title_max_length: 70                     # SEO best practice

sections:
  products:
    min_pages: 1
    max_pages: 6
    style_by_section:
      tone: "professional"
      voice: "active"
    mandatory_pages:
      - slug: "overview"
        page_role: "landing"
    optional_page_policies: []
  docs:
    min_pages: 5
    max_pages: 10
    style_by_section:
      tone: "instructional"
      voice: "direct"
    mandatory_pages:
      - slug: "_index"
        page_role: "toc"
      - slug: "installation"
        page_role: "workflow_page"
      - slug: "getting-started"
        page_role: "workflow_page"
      - slug: "overview"
        page_role: "landing"
      - slug: "developer-guide"
        page_role: "comprehensive_guide"
    optional_page_policies:
      - page_role: "workflow_page"
        source: "per_feature"
        priority: 1
      - page_role: "workflow_page"
        source: "per_workflow"
        priority: 2
  reference:
    min_pages: 1
    max_pages: 6
    style_by_section:
      tone: "technical"
      voice: "passive"
    mandatory_pages:
      - slug: "api-overview"
        page_role: "api_reference"
    optional_page_policies:
      - page_role: "api_reference"
        source: "per_api_symbol"
        priority: 1
  kb:
    min_pages: 8
    max_pages: 10
    style_by_section:
      tone: "conversational"
      voice: "active"
    mandatory_pages:
      - slug: "faq"
        page_role: "faq"
      - slug: "troubleshooting"
        page_role: "troubleshooting"
    optional_page_policies:
      - page_role: "best_practices"
        source: "per_claim_group"
        claim_group: "best_practices"
        min_claims: 8
        slug: "best-practices"
        section_path: "kb"
        priority: 1
        heading_overrides:
          - "Best Practices"
      - page_role: "tutorial"
        source: "per_claim_group"
        claim_group: "tutorials"
        min_claims: 3
        slug: "tutorials"
        section_path: "kb"
        priority: 1
        heading_overrides:
          - "Tutorials"
      - page_role: "feature_showcase"
        source: "per_key_feature"
        priority: 2
      - page_role: "toc"
        source: "per_topic_cluster"
        priority: 3
        min_features_per_cluster: 2
        cluster_slug_max_length: 30
  blog:
    min_pages: 1
    max_pages: 3
    style_by_section:
      tone: "informal"
      voice: "active"
    mandatory_pages:
      - slug: "announcement"
        page_role: "landing"
    optional_page_policies:
      - page_role: "landing"
        source: "per_deep_dive"
        priority: 2

# TC-983: Per-family overrides for mandatory pages.
# Merge strategy: family mandatory_pages are UNIONED with global mandatory_pages (not replaced).
# If a slug already exists in the global list, the family entry is skipped (no duplicates).
family_overrides:
  "3d":
    sections:
      docs:
        mandatory_pages:
          - slug: "model-loading"
            page_role: "workflow_page"
          - slug: "rendering"
            page_role: "workflow_page"
  "cells":
    sections:
      docs:
        mandatory_pages:
          - slug: "spreadsheet-operations"
            page_role: "workflow_page"
          - slug: "formula-calculation"
            page_role: "workflow_page"
  "note":
    sections:
      docs:
        mandatory_pages:
          - slug: "notebook-manipulation"
            page_role: "workflow_page"
          - slug: "document-conversion"
            page_role: "workflow_page"
