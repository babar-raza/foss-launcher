[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foss-launcher"
version = "2.0.0-alpha"
description = "Publication-ready content generation for FOSS products"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "structlog>=23.0",
    "typer>=0.9",
    "langgraph>=0.2",
    "jsonschema>=4.20",
    "requests>=2.28",
    "litellm>=1.0",
    "tree-sitter>=0.25.0",
    "tree-sitter-language-pack>=0.13.0",
    "tree-sitter-c-sharp>=0.23.0",
    "pytrends>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]
telemetry-api = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
]

[project.scripts]
launch = "launcher.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/launcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"  # require explicit @pytest.mark.asyncio on async tests
markers = [
    "golden: golden corpus regression tests — run with -m golden",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio.get_event_loop".msg = "Use @pytest.mark.asyncio + await instead of manual event loop management."
