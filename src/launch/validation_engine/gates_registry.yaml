# Validation Gate Registry
#
# Canonical source of truth for gate execution order, callable conventions,
# and error-handling policies.  Matches the runtime order in
# ``w9_validator/worker.py:execute_validator()`` exactly.
#
# Validate with:  python tools/extract_validation_gates.py --validate
# Regenerate with: python tools/extract_validation_gates.py --generate

gates:
  # ── Core content gates ──────────────────────────────────────────────
  - gate_id: gate_1_schema_validation
    display_name: Schema Validation
    order: 1
    module: launch.workers.w9_validator.worker
    callable_name: gate_1_schema_validation
    runner_type: inline_fn
    skip_group: none
    skip_on_error: false
    graceful_artifact_skip: false
    inputs: [run_dir, run_config, profile]
    notes: "JSON artifact schema + frontmatter YAML validation"

  - gate_id: gate_2_claim_marker_validity
    display_name: Claim Marker Validity
    order: 2
    module: launch.workers.w9_validator.gates.gate_2_claim_marker_validity
    callable_name: execute_gate
    runner_type: execute_gate
    skip_group: none
    skip_on_error: false
    graceful_artifact_skip: false
    inputs: [run_dir, profile]
    notes: "TC-570"

