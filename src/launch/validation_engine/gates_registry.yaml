    callable_name: execute_gate
    runner_type: execute_gate
    skip_group: none
    skip_on_error: false
    graceful_artifact_skip: false
    inputs: [run_dir, profile]
    mandatory_profiles: [ci, prod, pilot]
    notes: "Phase 2 Truth Policy. Checks api_inventory, shared_facts, page_plan exist."

