name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Choose Python version file
        id: pyver
        shell: bash
        run: |
          if [ -f .python-version ]; then
            echo "file=.python-version" >> "$GITHUB_OUTPUT"
          else
            echo "file=pyproject.toml" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ${{ steps.pyver.outputs.file }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        shell: bash
        run: make install-uv

      - name: Check no build artifacts tracked
        shell: bash
        run: |
          count=$(git ls-files | grep -c '\.egg-info' || true)
          if [ "$count" -gt 0 ]; then
            echo "ERROR: $count egg-info path(s) are tracked in git:"
            git ls-files | grep '\.egg-info'
            echo "Fix: git rm -r --cached '<path>.egg-info'"
            exit 1
          fi
          echo "OK: no egg-info build artifacts tracked in git"

      - name: Run gates
        shell: bash
        run: |
          mkdir -p ci_artifacts
          ./.venv/bin/python tools/validate_swarm_ready.py | tee ci_artifacts/validate_swarm_ready.txt

      - name: Run tests
        shell: bash
        run: |
          ./.venv/bin/python -m pytest -q | tee ci_artifacts/pytest.txt

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci_artifacts
          path: ci_artifacts
