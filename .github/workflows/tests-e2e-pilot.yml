name: Tests E2E Pilot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: tests-e2e-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUN_PILOT_E2E: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Choose Python version file
        id: pyver
        shell: bash
        run: |
          if [ -f .python-version ]; then
            echo "file=.python-version" >> "$GITHUB_OUTPUT"
          else
            echo "file=pyproject.toml" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ${{ steps.pyver.outputs.file }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        shell: bash
        run: make install-uv

      - name: Run TC-522 pilot E2E tests
        shell: bash
        run: |
          mkdir -p ci_artifacts
          ./.venv/bin/python -m pytest -q -rs tests/e2e/test_tc_522_pilot_cli.py | tee ci_artifacts/pytest_e2e_tc522.txt

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci_artifacts_e2e
          path: ci_artifacts
